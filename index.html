<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Qurylys Market</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: graphite side rail with orange markers + concrete-grey workspace; screens are working tools, the cost-on-site bar is the one bold element */
:root{
  --bg:#EEF0EC; --surface:#FAFBF8; --surface-2:#E4E7E0; --fg:#16202A; --muted:#5A6570; --line:#D5D9D1;
  --nav:#17212B; --nav-fg:#B9C3CC; --nav-hi:#F4F5F2; --nav-active:#24313F; --nav-line:#2A3744;
  --accent:#E2782A; --accent-ink:#A04E0F; --accent-soft:#FBE6D3; --on-accent:#1B130B;
  --ok:#22784A; --ok-soft:#DAEFE1; --warn:#8A6100; --warn-soft:#F6EAC6; --bad:#B03A2C; --bad-soft:#F5DDD8; --info:#2A5F96; --info-soft:#DCE7F2;
  --shadow:0 1px 2px rgba(22,32,42,.06),0 10px 30px rgba(22,32,42,.08);
  --f-body:'Golos Text','Segoe UI',Arial,sans-serif; --f-display:'Unbounded','Golos Text',Arial,sans-serif;
  --r-sm:6px; --r:10px; --r-lg:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171D; --surface:#19222B; --surface-2:#222D38; --fg:#E6EBEE; --muted:#98A4AF; --line:#2C3844;
  --nav:#0C1116; --nav-fg:#A8B3BD; --nav-hi:#F1F3F4; --nav-active:#1B2631; --nav-line:#1F2A35;
  --accent:#EE8B3E; --accent-ink:#F3A465; --accent-soft:#3A2715; --on-accent:#1B130B;
  --ok:#5CC28A; --ok-soft:#17332A; --warn:#E3B341; --warn-soft:#3A3012; --bad:#EE7C6C; --bad-soft:#3F1F1A; --info:#7DB0E6; --info-soft:#172A3E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171D; --surface:#19222B; --surface-2:#222D38; --fg:#E6EBEE; --muted:#98A4AF; --line:#2C3844;
  --nav:#0C1116; --nav-fg:#A8B3BD; --nav-hi:#F1F3F4; --nav-active:#1B2631; --nav-line:#1F2A35;
  --accent:#EE8B3E; --accent-ink:#F3A465; --accent-soft:#3A2715; --on-accent:#1B130B;
  --ok:#5CC28A; --ok-soft:#17332A; --warn:#E3B341; --warn-soft:#3A3012; --bad:#EE7C6C; --bad-soft:#3F1F1A; --info:#7DB0E6; --info-soft:#172A3E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,2.6vw,30px);line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:18px;font-weight:600;line-height:1.25}
h3{font-size:15px;font-weight:600}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}
.num{white-space:nowrap}

/* buttons & controls */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn-primary:hover{filter:brightness(1.05);border-color:var(--accent)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent}
.btn-sm{padding:6px 10px;font-size:13px}
.btn-ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn-bad{background:transparent;border-color:var(--line);color:var(--bad)}
.input,.select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.input:focus,.select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input-sm{padding:6px 8px;width:110px;text-align:right}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--bad-soft);color:var(--bad)} .b-info{background:var(--info-soft);color:var(--info)} .b-acc{background:var(--accent-soft);color:var(--accent-ink)}

/* login */
.login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.login-hero{background:var(--nav);color:var(--nav-hi);padding-block:56px;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:48px;display:flex;flex-direction:column;justify-content:space-between;gap:40px;position:relative;overflow:hidden}
.login-hero::after{content:"";position:absolute;right:-80px;bottom:-80px;width:340px;height:340px;background:repeating-linear-gradient(135deg,var(--accent) 0 22px,transparent 22px 44px);opacity:.14;border-radius:50%}
.login-hero h1{font-size:clamp(28px,4vw,46px);max-width:14ch;color:var(--nav-hi)}
.login-hero p{color:var(--nav-fg);max-width:46ch;font-size:16px}
.hero-points{display:grid;gap:14px;max-width:460px;position:relative;z-index:1}
.hero-points div{display:flex;gap:12px;align-items:flex-start;color:var(--nav-fg)}
.hero-points b{color:var(--nav-hi);font-weight:600;display:block}
.hero-points .ic{color:var(--accent);margin-top:2px}
.login-panel{padding-block:56px;padding-right:max(48px,env(safe-area-inset-right,0px));padding-left:48px;display:flex;flex-direction:column;justify-content:center;gap:20px;max-width:620px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;transition:border-color .15s,transform .15s}
.role-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.role-card .ic{width:22px;height:22px;color:var(--accent-ink)}
.role-card b{font-size:16px}
.role-card span{font-size:13px;color:var(--muted)}
.role-card.wide{grid-column:span 2}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.01em}
.logo-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);flex:none}
.logo-mark svg{width:18px;height:18px;stroke-width:2.2}
.logo small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;opacity:.7;letter-spacing:0}

/* shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);height:100%}
.side{background:var(--nav);color:var(--nav-fg);display:flex;flex-direction:column;gap:18px;padding:18px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.side .logo{color:var(--nav-hi);padding:4px 8px}
.org{padding:10px;border:1px solid var(--nav-line);border-radius:var(--r);display:flex;flex-direction:column;gap:2px}
.org b{color:var(--nav-hi);font-weight:600;font-size:14px}
.org span{font-size:12.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:var(--nav-fg);cursor:pointer;text-align:left;font-size:14.5px;position:relative}
.nav button:hover{background:var(--nav-active);color:var(--nav-hi)}
.nav button.on{background:var(--nav-active);color:var(--nav-hi);font-weight:500}
.nav button.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav .cnt{margin-left:auto;min-width:20px;padding:0 6px;height:20px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:600;display:grid;place-items:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--nav-line)}
.side-foot label{font-size:12px}
.side-foot select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--nav-line);background:var(--nav-active);color:var(--nav-hi)}
.side-foot button{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;background:transparent;color:var(--nav-fg);cursor:pointer;border-radius:8px}
.side-foot button:hover{background:var(--nav-active);color:var(--nav-hi)}
.main{overflow-y:auto;overflow-x:hidden;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.burger{display:none}
.search{position:relative;flex:1;max-width:460px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:36px}
.demo-pill{font-size:12.5px;color:var(--warn);background:var(--warn-soft);padding:4px 10px;border-radius:999px;white-space:nowrap}
.top-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.bell{position:relative}
.bell i{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.user{display:flex;align-items:center;gap:10px}
.user div{display:flex;flex-direction:column;line-height:1.2}
.user span{font-size:12.5px;color:var(--muted)}
.main-inner{padding-block:28px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;max-width:1360px;width:100%}
.scrim{display:none}

/* page blocks */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head .lead{display:flex;flex-direction:column;gap:6px;min-width:0}
.page-head .sub{color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid-3-1{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi span{color:var(--muted);font-size:13px}
.kpi b{font-size:24px;font-weight:600;letter-spacing:-.01em}
.kpi small{font-size:12.5px;color:var(--muted)}
.kpi small.up{color:var(--ok)}
.tasks{display:flex;flex-direction:column}
.task{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0;padding-top:0}
.task .dot{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none}
.task .t{flex:1;min-width:0}
.task .t b{display:block;font-weight:600}
.task .t span{color:var(--muted);font-size:13.5px}
.feed{display:flex;flex-direction:column;gap:12px}
.feed div{display:grid;grid-template-columns:52px 1fr;gap:10px;font-size:14px}
.feed time{color:var(--muted);font-size:13px}
.bar-track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:4px}
.obj{display:flex;flex-direction:column;gap:6px}
.obj-row{display:flex;justify-content:space-between;gap:10px;font-size:14px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--muted);text-align:left;font-size:13px;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
td.r,th.r{text-align:right}
.code{font-weight:600;white-space:nowrap}
.cell-sub{display:block;font-size:12.5px;color:var(--muted)}
tr.flag td{background:var(--warn-soft)}
tr.flag:hover td{background:var(--warn-soft)}
tr.sel td{background:var(--accent-soft)}
tr.sel:hover td{background:var(--accent-soft)}
.best{color:var(--ok);font-weight:600}

/* chips / tabs */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--surface-2);gap:2px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* catalog */
.cat-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
.filters{display:flex;flex-direction:column;gap:18px;position:sticky;top:76px}
.cat-list{display:flex;flex-direction:column;gap:2px}
.cat-list button{display:flex;justify-content:space-between;border:0;background:transparent;padding:7px 10px;border-radius:7px;cursor:pointer;text-align:left;font-size:14px}
.cat-list button:hover{background:var(--surface-2)}
.cat-list button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.cat-list span{color:var(--muted);font-size:13px}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;transition:border-color .15s}
.prod:hover{border-color:var(--accent)}
.prod-img{height:96px;border-radius:var(--r);background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.prod-img svg{width:52px;height:52px;stroke-width:1.2}
.prod b{font-weight:600;line-height:1.3}
.prod .price{font-size:18px;font-weight:600}
.prod .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}

/* stepper */
.stepper{display:flex;gap:8px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);padding-right:8px}
.step i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:600;font-size:13px;background:var(--surface-2)}
.step.on{color:var(--fg);font-weight:500}
.step.on i{background:var(--accent);color:var(--on-accent)}
.step.done i{background:var(--ok-soft);color:var(--ok)}
.step+.step::before{content:"";width:24px;height:1px;background:var(--line);margin-right:4px}
.drop{border:2px dashed var(--line);border-radius:var(--r-lg);padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;background:var(--surface);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .ic{width:34px;height:34px;color:var(--accent-ink)}
.proc{display:flex;flex-direction:column;gap:12px}
.proc div{display:flex;align-items:center;gap:12px;color:var(--muted)}
.proc div.done{color:var(--fg)}
.proc div.now{color:var(--fg);font-weight:500}
.proc .st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);flex:none}
.proc .done .st{background:var(--ok-soft);color:var(--ok)}
.proc .now .st{background:var(--accent-soft)}
.proc .now .st::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress div{height:100%;background:var(--accent);transition:width .5s}
.raw{color:var(--muted);font-size:13px}
.conf{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.conf i{width:38px;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:inline-block}
.conf i b{display:block;height:100%}
.note{font-size:12.5px;color:var(--warn);display:block;margin-top:3px}
.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:40px 20px}
.success .big{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.success .big svg{width:32px;height:32px;stroke-width:2.2}

/* compare */
.costbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2);min-width:120px}
.costbar .m{background:var(--fg);opacity:.75}
.costbar .d{background:var(--accent)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.callout{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);background:var(--info-soft);color:var(--fg)}
.callout .ic{color:var(--info);margin-top:2px}
.actionbar{position:sticky;bottom:0;z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:env(safe-area-inset-bottom,0px)}
.actionbar .grow{flex:1;min-width:200px}
.actionbar b{font-size:20px}
.radio{width:18px;height:18px;accent-color:var(--accent)}
.sup{display:flex;flex-direction:column}
.sup b{font-weight:600}
.stars{color:var(--accent-ink);font-size:12.5px}

/* timeline */
.trip{display:flex;flex-direction:column;gap:16px}
.timeline{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.tl{display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted)}
.tl i{height:6px;border-radius:3px;background:var(--surface-2)}
.tl.done i{background:var(--ok)}
.tl.now i{background:var(--accent)}
.tl.done,.tl.now{color:var(--fg)}
.route{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:500}
.route .ic{color:var(--accent-ink)}
.sum-line{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.sum-line b{color:var(--fg);font-size:16px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

function barChart(data,labels,unit){
  const W=560,H=240,p={l:44,r:12,t:24,b:28};const max=Math.ceil(Math.max(...data)/10)*10;const bw=(W-p.l-p.r)/data.length;
  const y=v=>p.t+(H-p.t-p.b)*(1-v/max);let g='';
  for(let v=0;v<=max;v+=10)g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${p.l-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  data.forEach((v,i)=>{const x=p.l+i*bw+bw*.22,w=bw*.56,last=i===data.length-1;g+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${H-p.b-y(v)}" rx="4" fill="${last?'var(--accent)':'var(--fg)'}" opacity="${last?1:.22}"/><text x="${x+w/2}" y="${y(v)-7}" text-anchor="middle" class="${last?'lbl':''}">${v.toLocaleString('ru-RU')}</text><text x="${x+w/2}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${unit}">${g}</svg>`;
}
function lineChart(data,labels){
  const W=560,H=220,p={l:52,r:20,t:24,b:28};const mn=335,mx=365;const sx=i=>p.l+i*(W-p.l-p.r)/(data.length-1);const sy=v=>p.t+(H-p.t-p.b)*(1-(v-mn)/(mx-mn));
  let g='';for(let v=mn;v<=mx;v+=10)g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)"/><text x="${p.l-8}" y="${sy(v)+4}" text-anchor="end">${v}</text>`;
  const pts=data.map((v,i)=>`${sx(i)},${sy(v)}`).join(' ');
  g+=`<polygon points="${p.l},${H-p.b} ${pts} ${sx(data.length-1)},${H-p.b}" fill="var(--accent)" opacity=".12"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  data.forEach((v,i)=>{g+=`<text x="${sx(i)}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`;if(i===data.length-1)g+=`<circle cx="${sx(i)}" cy="${sy(v)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><text x="${sx(i)-8}" y="${sy(v)-12}" text-anchor="end" class="lbl">${v} тыс.</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Динамика цены арматуры">${g}</svg>`;
}

    <table><thead><tr><th>№</th><th>Наименование</th><th>Кол-во</th><th>Ед.</th><th>Цена, ₸</th><th>Сумма, ₸</th></tr></thead><tbody><tr><td>1</td><td>Цемент М500 Д0, мешок 50 кг</td><td>480</td><td>мешок</td><td>2 380</td><td>1 142 400</td></tr><tr><td>2</td><td>Щебень гранитный фр. 20–40</td><td>96</td><td>т</td><td>6 900</td><td>662 400</td></tr><tr><td>3</td><td>Песок строительный</td><td>70</td><td>т</td><td>3 486</td><td>244 020</td></tr></tbody></table>
    <p style="text-align:right"><b>Итого: 2 048 820 ₸</b></p><div class="sign"><span>Руководитель ________</span>${d[6]==='b-ok'?'<span class="stamp">Подписано ЭЦП</span>':'<span>Ожидает подписи</span>'}</div></div>
    <div class="actions" style="justify-content:flex-end">${d[6]==='b-warn'?`<button class="btn btn-primary" data-act="sign">Подписать ЭЦП</button>`:''}<button class="btn" data-act="close">Закрыть</button></div>`;}
  if(m.t==='invite'){
    inner=`<div class="modal-head"><h2 style="font-size:20px">Пригласить сотрудника</h2><button class="btn btn-ghost" data-act="close" aria-label="Закрыть">${ic('x')}</button></div>
    <form id="inviteForm" style="display:flex;flex-direction:column;gap:14px"><div class="grid-2"><label class="field">Имя и фамилия<input class="input" id="invName" required value="Алия Серикова"></label><label class="field">Должность<input class="input" id="invPost" value="Инженер ПТО"></label></div>
    <label class="field">Электронная почта<input class="input" id="invMail" type="email" value="a.serikova@example.kz"></label>
    <label class="field">Роль<select class="select" id="invRole"><option>Снабженец</option><option>Согласующий</option><option>Бухгалтер</option><option>Приёмка</option><option>Наблюдатель</option></select></label>
    <div class="actions" style="justify-content:flex-end"><button type="button" class="btn" data-act="close">Отмена</button><button class="btn btn-primary" type="submit">Отправить приглашение</button></div></form>`;}
  if(m.t==='notify'){
    inner=`<div class="modal-head"><h2 style="font-size:20px">Уведомления</h2><button class="btn btn-ghost" data-act="close" aria-label="Закрыть">${ic('x')}</button></div>
    <div class="feed">${[['12:04','ТОО «QazBlock» прислал КП по заявке ЗК-0139'],['11:32','Рейс ДС-0571 выехал из Караганды'],['10:15','Заявка ЗК-0142 отправлена 7 поставщикам'],['09:50','Счёт № 902 ожидает оплаты'],['Вчера','Подписан договор № П-221']].map(f=>`<div><time>${f[0]}</time><span>${f[1]}</span></div>`).join('')}</div>`;}
  return `<div class="overlay" data-act="overlay"><div class="modal" role="dialog" aria-modal="true">${inner}</div></div>`;
}

/* ---------- render ---------- */
const SCREENS={overview:()=>({supplier:supOverview,carrier:carOverview,admin:admOverview}[S.role]||buyerOverview)(),catalog,requests,'new-request':newRequest,compare,orders,approvals,delivery,docs,analytics,company,rfq:rfqView,products,sorders,loads,trips:ctrips,companies,moderation,aorders,users};
function render(keep=true){
  const app=document.getElementById('app');
  if(!S.role){app.innerHTML=loginView();return}
  const m=document.getElementById('main');const st=keep&&m?m.scrollTop:0;
  const fn=SCREENS[S.route]||SCREENS.overview;
  app.innerHTML=shell(fn());
  const nm=document.getElementById('main');if(nm)nm.scrollTop=st;
}
function go(r){S.route=r;S.navOpen=false;S.modal=null;if(r==='new-request'&&S.nr.step===4)S.nr={step:1,stage:0,file:''};render(false)}
function startProcessing(file){
  S.nr={step:2,stage:0,file};render();
  const t=setInterval(()=>{S.nr.stage++;if(S.nr.stage>STAGES.length){clearInterval(t);S.nr.step=3;}if(S.route==='new-request')render();},650);
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,d=el.dataset;
  if(a==='overlay'&&e.target!==el)return;
  switch(a){
    case 'login':S.role=d.role;S.route='overview';try{localStorage.setItem('qm_role',d.role)}catch(_){}render(false);break;
    case 'logout':S.role=null;try{localStorage.removeItem('qm_role')}catch(_){}render(false);break;
    case 'go':go(d.r);break;
    case 'openNav':S.navOpen=true;render();break;
    case 'closeNav':S.navOpen=false;render();break;
    case 'notify':S.modal={t:'notify'};render();break;
    case 'close':case 'overlay':S.modal=null;render();break;
    case 'toast':toast(d.m);break;
    case 'cat':S.cat=d.c;render();break;
    case 'product':S.modal={t:'product',id:+d.id};render();break;
    case 'addToReq':S.modal=null;render();toast(`«${d.n}» добавлен в черновик ЗК-0144`);break;
    case 'sample':startProcessing('Спецификация_блок3.xlsx');break;
    case 'nrBack':S.nr={step:1,stage:0,file:''};render();break;
    case 'nrSend':S.nr.step=4;S.requests.unshift({id:'ЗК-0145',obj:'ЖК «Нурлы Аспан», блок 3',date:'15.10.2026',items:12,status:'kp',offers:'0 из 7',due:'20.10.2026'});render(false);toast('Запросы отправлены 7 поставщикам');break;
    case 'nrReset':S.nr={step:1,stage:0,file:''};render(false);break;
    case 'withDel':S.withDel=d.v==='1';render();break;
    case 'pick':S.pick=d.s;render();break;
    case 'orderModal':S.modal={t:'order'};render();break;
    case 'placeOrder':{const o=OFFERS.find(x=>x.s===S.pick);S.orders.unshift({id:'ЗКЗ-2091',s:o.s,obj:'Логистический склад, Косшы',sum:o.mat+o.del,date:'15.10.2026',status:'approval',items:9,author:'Е. Абдрахманов'});const rq=S.requests.find(r=>r.id==='ЗК-0139');if(rq)rq.status='ordered';S.modal=null;go(S.role==='developer'?'approvals':'orders');toast('Заказ ЗКЗ-2091 отправлен на согласование');break}
    case 'ordF':S.ordF=d.v;render();break;
    case 'approve':{const o=S.orders.find(x=>x.id===d.id);o.status='approved';render();toast(`Заказ ${o.id} согласован, поставщик получил уведомление`);break}
    case 'reject':{const o=S.orders.find(x=>x.id===d.id);o.status='returned';render();toast(`Заказ ${o.id} возвращён снабженцу`);break}
    case 'chooseBid':S.bidChosen=d.c;{const b=S.bids.find(x=>x.c===d.c);S.trips.unshift({id:'ДС-0574',order:'ЗКЗ-2084',from:'Астана, промзона',to:'Косшы, логистический склад',cargo:'Цемент М500, песок',w:'14 т',carrier:b.c,truck:b.truck,eta:b.t,step:1,mat:2048000,del:b.p})};render();toast(`Перевозчик выбран: ${d.c}`);break;
    case 'receive':{const t=S.trips.find(x=>x.id===d.id);t.step=5;const o=S.orders.find(x=>x.id===t.order);if(o)o.status='delivered';render();toast('Получение подтверждено, акт сформирован');break}
    case 'docF':S.docF=d.v;render();break;
    case 'doc':S.modal={t:'doc',i:+d.i};render();break;
    case 'sign':{const doc=DOCS[S.modal.i];doc[5]='Подписан ЭЦП';doc[6]='b-ok';render();toast('Документ подписан ЭЦП');break}
    case 'invite':S.modal={t:'invite'};render();break;
    case 'openRfq':S.rfq=d.id;S.route='rfq';render(S.route==='rfq');break;
    case 'sendKp':{const r=S.rfqs.find(x=>x.id===d.id);r.items.forEach((it,i)=>{const v=document.getElementById('rp'+i);if(v)it[3]=parseFloat(v.value.replace(/\s/g,''))||it[3]});r.status='sent';render();toast(`КП по ${r.id} отправлено покупателю`);break}
    case 'price':S.myProducts.forEach(p=>{p.upd='15.10.2026'});render();toast('Прайс загружен: обновлено 6 позиций');break;
    case 'savePrice':{const p=S.myProducts[+d.i];const v=document.getElementById('mp'+d.i);p.p=parseFloat(v.value.replace(/\s/g,''))||p.p;p.upd='15.10.2026';render();toast('Цена обновлена и видна покупателям');break}
    case 'ship':{const o=S.sOrders.find(x=>x.id===d.id);o.status='transit';render();toast(`Отгрузка по ${o.id} подтверждена`);break}
    case 'bid':{const l=S.loads[+d.i];const v=parseFloat((document.getElementById('bid'+d.i).value||'').replace(/\s/g,''));if(!v){toast('Введите ставку в тенге, например 75 000');break}l.my=v;l.bids++;if(!l.best||v<l.best)l.best=v;render();toast(`Ставка ${money(v)} отправлена`);break}
    case 'tripNext':{const t=S.cTrips[+d.i];t.step++;render();toast('Статус обновлён: покупатель видит изменения');break}
    case 'coOk':S.companies[+d.i].st='ok';render();toast('Компания допущена к сделкам');break;
    case 'coNo':S.companies[+d.i].st='no';render();toast('Заявка компании отклонена');break;
    case 'mdOk':S.modProducts[+d.i].st='ok';render();toast('Карточка опубликована');break;
    case 'mdNo':S.modProducts[+d.i].st='no';render();toast('Карточка отклонена, поставщик получит причину');break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='roleSel'){S.role=e.target.value;S.route='overview';S.navOpen=false;try{localStorage.setItem('qm_role',S.role)}catch(_){}render(false)}
  if(e.target.id==='specFile'&&e.target.files[0])startProcessing(e.target.files[0].name);
});
document.addEventListener('input',e=>{
  if(e.target.id==='catQ'){S.q=e.target.value;document.getElementById('catGrid').innerHTML=catGrid()}
  if(e.target.classList.contains('rfqp')){const cur=S.rfqs.find(r=>r.id===S.rfq);let tot=0;cur.items.forEach((it,i)=>{const v=parseFloat((document.getElementById('rp'+i).value||'0').replace(/\s/g,''))||0;const s=v*it[1];tot+=s;document.getElementById('rs'+i).textContent=money(s)});document.getElementById('rTotal').textContent=money(tot)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='gsearch'&&['developer','contractor'].includes(S.role)){S.q=e.target.value;S.cat='Все';go('catalog')}
  if(e.key==='Escape'&&(S.modal||S.navOpen)){S.modal=null;S.navOpen=false;render()}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='inviteForm'){e.preventDefault();const n=document.getElementById('invName').value.trim()||'Новый сотрудник';S.employees.push({n,p:document.getElementById('invPost').value||'Сотрудник',r:document.getElementById('invRole').value,perm:['Заявки']});S.modal=null;render();toast(`Приглашение отправлено: ${n}`)}
});
['dragover','dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{
  const dz=e.target.closest&&e.target.closest('#drop');if(!dz)return;e.preventDefault();
  if(t==='dragover')dz.classList.add('over');else dz.classList.remove('over');
  if(t==='drop'&&e.dataTransfer.files[0])startProcessing(e.dataTransfer.files[0].name);
}));
render(false);
</script>

</body></html>
